<!DOCTYPE html>

<title>Sailor Piece Mobile</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #020617;
    color: white;
}

/* HEADER */
.header {
    padding: 15px;
    text-align: center;
    font-size: 20px;
    background: #0f172a;
    color: #38bdf8;
}

/* BUSCADOR */
.search-box {
    padding: 10px;
}

input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: #1e293b;
    color: white;
    font-size: 16px;
}

/* BOTONES */
.tabs {
    display: flex;
}

.tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    background: #020617;
    border-bottom: 2px solid transparent;
    cursor: pointer;
}

.tab.active {
    border-bottom: 2px solid #38bdf8;
}

/* LISTA */
.list {
    padding: 10px;
}

.item {
    padding: 15px;
    margin: 8px 0;
    background: #0f172a;
    border-radius: 10px;
    text-align: center;
    font-size: 16px;
}

/* CARD CENTRAL */
.card {
    margin: 10px;
    padding: 15px;
    background: #0f172a;
    border-radius: 10px;
    box-shadow: 0 0 10px #38bdf8;
}
</style>
</head>

function renderList(){
    const list = document.getElementById("list");
    list.innerHTML = "";

    database
    .filter(item => item.type === currentTab)
    .forEach(item => {
        const div = document.createElement("div");
        div.className = "item";
        div.textContent = item.name;
        div.onclick = () => show(item);
        list.appendChild(div);
    });
}

function show(item){
    document.getElementById("display").innerHTML =
        `<h3>${item.name}</h3>${item.recipe}`;
}

function switchTab(tab){
    currentTab = tab;

    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    event.target.classList.add("active");

    renderList();
}

document.getElementById("search").addEventListener("input", e=>{
    const val = e.target.value.toLowerCase();

    if(val === ""){
        renderList();
        document.getElementById("display").innerHTML =
            "Selecciona un arma o busca un material";
        return;
    }

    const results = database.filter(item =>
        item.materials.some(m => m.toLowerCase().includes(val))
    );

    document.getElementById("display").innerHTML =
        results.map(r => `<h3>${r.name}</h3>${r.recipe}<hr>`).join("");
});

renderList();

</script>
